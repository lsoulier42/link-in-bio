<VirtualHost *:80>
    DocumentRoot /var/www/html/backend/public
    DirectoryIndex index.php index.html

    # Redirection pour le front-end React (SPA)
    RedirectMatch ^/$ /app/

    Alias /app /var/www/html/backend/public/app
    <Directory /var/www/html/backend/public/app>
        DirectoryIndex index.html
        AllowOverride None
        Require all granted
        FallbackResource /app/index.html
    </Directory>

    # Configuration pour l'API Symfony
    <Directory /var/www/html/backend/public>
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    <Directory /var/www/html/backend/public/bundles>
        FallbackResource disabled
    </Directory>

    ErrorLog /var/log/apache2/project_error.log
    CustomLog /var/log/apache2/project_access.log combined
</VirtualHost>
